name: Build WNACG test APK

on:
  push:
    branches:
      - main
      - fix/wnacg-domain-and-apk-build
    paths:
      - 'src/zh/wnacg/**'
      - '.github/workflows/build-wnacg.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wnacg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wnacg:
    name: Build and lint WNACG
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Assemble and lint only WNACG
        run: ./gradlew :src:zh:wnacg:assembleRelease :src:zh:wnacg:lintRelease

      - name: Upload installable test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WNACG-1.6.5-test-APK
          path: src/zh/wnacg/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
