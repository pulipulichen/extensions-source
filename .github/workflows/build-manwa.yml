name: Build Manwa test APK

on:
  push:
    branches:
      - main
      - fix/manwa-ranking-diagnostics-20261101
    paths:
      - 'src/zh/manwa/**'
      - '.github/workflows/build-manwa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manwa:
    name: Build and lint Manwa
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Missing secrets must fail the build; never fall back to runner-specific debug signing.
      - name: Restore persistent signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEY ALIAS KEY_STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key. Reuse the persistent signing key already configured for WNACG."
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEY" | base64 --decode > signingkey.jks
          test -s signingkey.jks
          keytool -list -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" > /dev/null

      - name: Assemble and lint only Manwa
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:zh:manwa:assembleRelease :src:zh:manwa:lintRelease

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk=$(find src/zh/manwa/build/outputs/apk/release -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          signer=$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$signer"
          "$signer" verify --print-certs "$apk"

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks

      - name: Upload installable test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Manwa-signed-test-APK
          path: src/zh/manwa/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
